[project]

site_name = "PyField"
site_description = "Acoustic field simulator for ultrasound transducers."
site_author = "Esteban Rivera"
site_url = "https://estebanrivera08.github.io/PyField/"
repo_url = "https://github.com/EstebanRivera08/PyField"
repo_name = "EstebanRivera08/PyField"
edit_uri = "edit/main/docs/"

copyright = "Copyright &copy; 2026 Esteban Rivera"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "User Guide" = [
    { "Overview" = "user-guide/index.md" },
    { "Getting Started" = "user-guide/getting-started.md" },
    { "Installation" = "user-guide/installation.md" },
    { "Transducers" = [
      { "Overview" = "user-guide/transducers.md" },
      { "Mono-elements" = "user-guide/mono-elements.md" },
      { "Multi-elements" = "user-guide/multi-elements.md" },
      { "Transducer Objects" = "user-guide/transducer-objects.md" },
      { "Field II Correspondence" = "user-guide/fieldii-correspondence.md" },
    ]},
    { "Simulation" = [
      { "Overview" = "user-guide/simulation.md" },
      { "Monochromatic" = "user-guide/monochromatic.md" },
      { "Transient Impulse" = "user-guide/transient-impulse.md" },
      { "Transient + Excitation" = "user-guide/transient-excitation.md" },
    ]},
    { "Visualization" = [
      { "Overview" = "user-guide/visualization.md" },
      { "2D Planes" = "user-guide/2d-planes.md" },
      { "3D Volume" = "user-guide/3d-volume.md" },
      { "3D Planes" = "user-guide/3d-planes.md" },
    ]},
    { "Utilities" = [
      { "Overview" = "user-guide/utilities.md" },
      { "Geometry Functions" = "user-guide/geometry.md" },
      { "Brain Atlas" = "user-guide/brain-atlas.md" },
      { "PyVista Integration" = "user-guide/pyvista.md" },
    ]},
    { "Background Theory" = [
      { "Overview" = "user-guide/theory.md" },
      { "Spatial Impulse Response" = "user-guide/sir.md" },
      { "Rectangular Aperture SIR" = "user-guide/rect-aperture.md" },
      { "FST and SDI Methods" = "user-guide/methods.md" },
      { "Patch Subdivision" = "user-guide/subdivision.md" },
      { "Transducer SIR" = "user-guide/transducer-sir.md" },
      { "From SIR to Pressure" = "user-guide/pressure.md" },
    ]},
  ]},
  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Transducers" = "api/transducers.md" },
    { "Simulation" = "api/simulation.md" },
    { "Visualization" = "api/visualization.md" },
    { "Brain Atlas" = "api/brain_atlas.md" },
    { "Plotting" = "api/plotting.md" },
  ]},
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "1. Transducer Gallery" = "examples/example01_transducer_gallery.md" },
    { "2. Mono-element Fields" = "examples/example02_monoelements_monochromatic_CW.md" },
    { "3. Multi-element 3-D" = "examples/example03_multielements_monochromatic_CW.md" },
    { "4. Diverging Wave (Transient)" = "examples/example04_lineararray_excitation_DW.md" },
    { "5. Steered Plane Wave (3-D)" = "examples/example05_matrixarray_pulsed_steeredPW.md" },
    { "6. Concave Pulse-Echo PSF" = "examples/example06_concave_PSF.md" },
    { "7. Focused TX, All-RX" = "examples/example07_lineararray_TXfocus_RXall.md" },
    { "8. Full Matrix Capture" = "examples/example08_synthetic_aperture_FMC.md" },
    { "9. B-mode PSF Image" = "examples/example09_lineararray_imagePSF.md" },
    { "10. Peak Pressure & Ispta" = "examples/example10_intensities_peak_pressure.md" },
    { "11. CW Field with Attenuation" = "examples/example11_lineararray_attenuations.md" },
    { "12. Mouse Brain Atlas" = "examples/example12_txconcave_mousebrain.md" },
    { "13. Rat Brain Targeting" = "examples/example13_txlinear_ratbrainzones.md" },
    { "14. STL Meshes" = "examples/example14_importstl_petri_dish.md" },
    { "15. STL + Simulation" = "examples/example15_monoelement_petridish.md" },
    { "16. Surface Subdivision" = "examples/example16_subdivide_parametric_surface.md" },
    { "17. Import a Field II Probe" = "examples/example17_import_fieldii_transducer.md" },
    { "18. Custom Sparse Array" = "examples/example18_customtransducer_3Dplanes.md" },
    { "19. Dual-Probe Pulse-Echo" = "examples/example19_dualprobe_reception_show.md" },
  ]},
  { "Contributing" = "contributing.md" },
]

[project.theme]
variant = "modern"
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/waves"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/EstebanRivera08/PyField"
name = "PyField on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/pyfield/"
name = "PyField on PyPI"
