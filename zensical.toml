[project]

site_name = "PyField"
site_description = "Acoustic field simulator for ultrasound transducers."
site_author = "deyve"

# nav = [
#   { "Home" = "index.md" },
#   { "Transducers" = "transducers.md" },
#   { "Simulation" = "simulation.md" },
