[project]
name = "esdiva"
version = "0.2.1"
description = "eSDIva — Efficient Sparse Delta Integration for Vectorized Acoustics. Fast, exact ultrasound pressure-field simulation for arbitrary transducer geometries."
readme = "README.md"
authors = [
    { name = "Deyver Esteban Rivera", email = "113285895+EstebanRivera08@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "h5py>=3.13.0",
    "matplotlib>=3.10.1",
    "numba>=0.61",
    "numpy>= 2.1.2",
    "pyvista>=0.45.0",
    "scipy>=1.15.2",
]

# Opt-in extras: a plain `pip install esdiva` gets the simulator core only.
# Each extra backs one feature that is not needed to simulate a field:
#   atlas   — BrainGlobe stack (pandas, pyarrow, tifffile) for `utilities.BG_Atlas`
#   video   — imageio/ffmpeg backends PyVista needs for `save_pyvista_movie`
#   jupyter — PyVista's trame/ipywidgets stack for in-notebook 3-D rendering
[project.optional-dependencies]
atlas = [
    "brainglobe-atlasapi>=2.2.1",
    "brainglobe-space>=1.0.3",
]
video = [
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
]
jupyter = ["pyvista[jupyter]>=0.45.0"]
all = ["esdiva[atlas,jupyter,video]"]

[project.urls]
Homepage = "https://estebanrivera08.github.io/eSDIva/"
Documentation = "https://estebanrivera08.github.io/eSDIva/"
Repository = "https://github.com/EstebanRivera08/eSDIva"
Issues = "https://github.com/EstebanRivera08/eSDIva/issues"

[tool.ruff]
exclude = []

[project.scripts]
esdiva = "esdiva:main"

[build-system]
# Pin < 1.28: hatchling 1.28+ emits Metadata 2.5, which twine 6.2 rejects on
# upload (its metadata-version allowlist stops at 2.4). 2.4 already carries the
# SPDX license-expression we need.
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

# Keep the sdist lean: ship source, license, and readme — not the docs gifs,
# example figures, or graphify artefacts (those bloated it to 63 MB).
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

# torch not currently used — uncomment this index + the `torch` dep + source below to re-enable.
# [[tool.uv.index]]
# name = "pytorch"
# url = "https://download.pytorch.org/whl/cu126"
# default = false

[dependency-groups]
dev = [
    # Every optional extra, so a repo clone (`uv sync`) behaves like `esdiva[all]`.
    "esdiva[all]",
    "zensical>=0.0.28",
    "ipykernel>=6.29.5",
    "ipympl>=0.9.7",
    "ipython>=9.1.0",
    "ipyvtklink>=0.2.3",
    "ruff>=0.12.0",
    # "torch>=2.6.0",  # unused for now; CUDA-only index breaks macOS sync. Re-enable with index above.
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ty>=0.0.10",
    "pytest-pyvista>=0.3.2",
    "mkdocstrings[python]>=1.0.3",
    "prek>=0.2.0",
    "vtk>=9.2.2",
    "pytest-mpl>=0.16.0",
    "tqdm<=4.66.5",
    "codespell>=2.3.0",
    "numpydoc>=1.9.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "twine>=6.1",
    "packaging>=24.2",
]

# [tool.uv.sources]
# torch = {index = "pytorch"}

# --------------------------------------------------------------------------- #
#  pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:The active matplotlib backend.*is non-interactive:UserWarning",
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

# --------------------------------------------------------------------------- #
#  coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
source = ["esdiva"]
omit = ["*/examples/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

# --------------------------------------------------------------------------- #
#  codespell
# --------------------------------------------------------------------------- #
[tool.codespell]
skip = "*.ipynb,*.lock,examples/*,.git"
ignore-words-list = "ser,hsi,nd,mear,apod,fo,te,bu"

# --------------------------------------------------------------------------- #
# numpydoc
# --------------------------------------------------------------------------- #

[tool.numpydoc_validation]
exclude = [
    '\.__init__$',
    '\._.*$',

    '^\.examples/.*',

]
checks = [
    "all",  # Report on all checks, except the below
    "GL01",
    "ES01",
    "SA01",
    "EX01",
]
numpydoc_validation_checks = ["all", "GL01", "ES01", "SA01", "EX01"]

