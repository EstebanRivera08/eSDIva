[project]
name = "pyfield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Esteban RIvera", email = "113285895+EstebanRivera08@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "brainglobe>=1.3.1",
    "brainglobe-atlasapi>=2.2.1",
    "brainglobe-space>=1.0.3",
    "brainglobe-workflows>=1.4.1",
    "brainrender>=2.1.17",
    "h5py>=3.13.0",
    "imageio[ffmpeg]>=2.37.0",
    "ipykernel>=6.29.5",
    "ipympl>=0.9.7",
    "ipython>=9.1.0",
    "ipyvtklink>=0.2.3",
    "joblib>=1.4.2",
    "markupsafe<3.0.2",
    "matplotlib>=3.10.1",
    "numpy<=2.1.2",
    "pip>=25.0.1",
    "plotly>=6.1.2",
    "pyqt5-qt5<=5.15.2",
    "pyside6>=6.9.0",
    "pyvista[jupyter]>=0.45.0",
    "ruff>=0.12.0",
    "scikit-image>=0.25.2",
    "scipy>=1.15.2",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
]

[tool.ruff]
line-length = 88

[project.scripts]
pyfield = "pyfield:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "zensical>=0.0.28",
]
