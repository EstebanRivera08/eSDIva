[project]
name = "pysonogen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Esteban RIvera", email = "113285895+EstebanRivera08@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brainglobe>=1.3.1",
    "brainglobe-atlasapi>=2.2.1",
    "brainglobe-space>=1.0.3",
    "brainglobe-workflows>=1.4.1",
    "brainrender>=2.1.17",
    "h5py>=3.13.0",
    "imageio[ffmpeg]>=2.37.0",
    "ipykernel>=6.29.5",
    "ipyvtklink>=0.2.3",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "pip>=25.0.1",
    "pyqt5-qt5<=5.15.2",
    "pyside6>=6.9.0",
    "pyvista[jupyter]>=0.45.0",
    "scikit-image>=0.25.2",
    "scipy>=1.15.2",
]

[project.scripts]
pysonogen = "pysonogen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
